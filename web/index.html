<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>pneuma</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/icons/logo.svg" alt="" width="32" height="32" class="logo">
        <svg class="wordmark" viewBox="0 0 37 8" width="74" height="16" shape-rendering="crispEdges" role="img" aria-label="pneuma"><g class="r0"><rect x="0" y="0" width="4" height="1"/><rect x="6" y="0" width="4" height="1"/><rect x="13" y="0" width="3" height="1"/><rect x="18" y="0" width="1" height="1"/><rect x="22" y="0" width="1" height="1"/><rect x="24" y="0" width="6" height="1"/><rect x="33" y="0" width="3" height="1"/></g><g class="r1"><rect x="0" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/><rect x="12" y="1" width="1" height="1"/><rect x="16" y="1" width="1" height="1"/><rect x="18" y="1" width="1" height="1"/><rect x="22" y="1" width="1" height="1"/><rect x="24" y="1" width="1" height="1"/><rect x="27" y="1" width="1" height="1"/><rect x="30" y="1" width="1" height="1"/><rect x="36" y="1" width="1" height="1"/></g><g class="r2"><rect x="0" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="12" y="2" width="5" height="1"/><rect x="18" y="2" width="1" height="1"/><rect x="22" y="2" width="1" height="1"/><rect x="24" y="2" width="1" height="1"/><rect x="27" y="2" width="1" height="1"/><rect x="30" y="2" width="1" height="1"/><rect x="33" y="2" width="4" height="1"/></g><g class="r3"><rect x="0" y="3" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="10" y="3" width="1" height="1"/><rect x="12" y="3" width="1" height="1"/><rect x="18" y="3" width="1" height="1"/><rect x="22" y="3" width="1" height="1"/><rect x="24" y="3" width="1" height="1"/><rect x="27" y="3" width="1" height="1"/><rect x="30" y="3" width="1" height="1"/><rect x="32" y="3" width="1" height="1"/><rect x="36" y="3" width="1" height="1"/></g><g class="r4"><rect x="0" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="10" y="4" width="1" height="1"/><rect x="12" y="4" width="1" height="1"/><rect x="18" y="4" width="1" height="1"/><rect x="22" y="4" width="1" height="1"/><rect x="24" y="4" width="1" height="1"/><rect x="27" y="4" width="1" height="1"/><rect x="30" y="4" width="1" height="1"/><rect x="32" y="4" width="1" height="1"/><rect x="36" y="4" width="1" height="1"/></g><g class="r5"><rect x="0" y="5" width="4" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="10" y="5" width="1" height="1"/><rect x="13" y="5" width="4" height="1"/><rect x="19" y="5" width="4" height="1"/><rect x="24" y="5" width="1" height="1"/><rect x="27" y="5" width="1" height="1"/><rect x="30" y="5" width="1" height="1"/><rect x="33" y="5" width="4" height="1"/></g><g class="r6"><rect x="0" y="6" width="1" height="1"/></g><g class="r7"><rect x="0" y="7" width="1" height="1"/></g></svg>
        <button type="button" class="gear" id="settings-btn" data-t-title="settings">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 1h2v2h2v1h1v1h1v2h2v2h-2v2h-1v1h-1v1H9v2H7v-2H5v-1H4v-1H3V9H1V7h2V5h1V4h1V3h2V1Zm0 5v1H6v2h1v1h2V9h1V7H9V6H7Z"/></svg>
        </button>
      </div>

      <section class="panel chats-panel">
        <h2 class="panel-title"><span data-t="chats"></span></h2>
        <button type="button" class="panel-action" id="new-chat" data-t-title="newChat">+</button>
        <form class="new-chat" id="new-chat-form" hidden>
          <input id="new-chat-input" maxlength="80" autocomplete="off" spellcheck="false">
        </form>
        <ul class="chat-list" id="chat-list"></ul>
      </section>

    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="panel chat" id="chat">
      <header class="chat-head">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <h1 class="panel-title chat-title" id="chat-title" data-t-title="rename"></h1>
        <span class="status" id="status"></span>
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" class="tab current" id="tab-messages" data-t="messagesTab"></button>
          <button type="button" role="tab" class="tab" id="tab-files"><span data-t="filesTab"></span><span class="count" id="files-count"></span></button>
        </nav>
        <div class="chat-members" id="chat-members" hidden></div>
      </header>

      <div class="log" id="log" aria-live="polite">
        <div class="loader" id="loader" hidden></div>
        <div class="messages" id="messages"></div>
        <div class="empty" id="empty" hidden>
          <img src="/icons/logo.svg" alt="" width="96" height="96" class="logo">
          <p id="empty-text"></p>
        </div>
        <div class="uploads" id="uploads"></div>
      </div>

      <div class="files" id="files" hidden>
        <section id="files-media-section">
          <h3 class="files-h"><span data-t="mediaTab"></span> <span class="count" id="media-count"></span></h3>
          <div class="media-grid" id="media-grid"></div>
        </section>
        <section id="files-docs-section">
          <h3 class="files-h"><span data-t="docsTab"></span> <span class="count" id="docs-count"></span></h3>
          <ul class="doc-list" id="doc-list"></ul>
        </section>
        <div class="empty" id="files-empty" hidden>
          <p data-t="noFiles"></p>
        </div>
      </div>

      <div class="quote-bar" id="quote-bar" hidden>
        <span class="quote-prompt" aria-hidden="true">↩</span>
        <span class="quote-text" id="quote-text"></span>
        <button type="button" class="icon-btn" id="quote-cancel">×</button>
      </div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="icon-btn" id="attach" data-t-title="attach">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <span class="prompt" aria-hidden="true">&gt;</span>
        <textarea id="input" rows="1" enterkeyhint="send"></textarea>
        <button type="submit" class="send" id="send" data-t-title="send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden>
      </form>
    </main>

    <aside class="panel devices-panel" id="devices">
      <h2 class="panel-title"><span data-t="devices"></span></h2>
      <ul class="device-list" id="device-list"></ul>
    </aside>
  </div>

  <div class="ctx" id="ctx" role="menu" hidden></div>

  <dialog class="settings" id="settings">
    <form method="dialog" class="panel settings-panel">
      <h2 class="panel-title"><span data-t="settings"></span></h2>
      <button class="panel-action" value="close" aria-label="close">×</button>

      <section>
        <h3 data-t="thisDevice"></h3>
        <label class="row"><span data-t="language"></span>
          <select id="set-lang"><option value="auto">auto</option><option value="es">español</option><option value="en">english</option></select>
        </label>
        <label class="row"><span data-t="textSize"></span>
          <select id="set-size"><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option></select>
        </label>
        <label class="row"><span data-t="enterSends"></span><input type="checkbox" id="set-enter"></label>
        <label class="row"><span data-t="notifications"></span><input type="checkbox" id="set-notify"></label>
        <label class="row"><span data-t="animations"></span><input type="checkbox" id="set-anim"></label>
      </section>

      <section>
        <h3 data-t="allDevices"></h3>
        <label class="row"><span data-t="fileRetention"></span>
          <select id="set-file-retention">
            <option value="0" data-t="forever"></option>
            <option value="7">7 d</option><option value="30">30 d</option><option value="90">90 d</option><option value="365">365 d</option>
          </select>
        </label>
        <label class="row"><span data-t="retention"></span>
          <select id="set-retention">
            <option value="0" data-t="forever"></option>
            <option value="1">1 d</option><option value="7">7 d</option><option value="30">30 d</option><option value="90">90 d</option><option value="365">365 d</option>
          </select>
        </label>
        <label class="row"><span data-t="maxUpload"></span>
          <select id="set-max">
            <option value="104857600">100 MB</option><option value="1073741824">1 GB</option><option value="4294967296">4 GB</option><option value="10737418240">10 GB</option><option value="53687091200">50 GB</option>
          </select>
        </label>
        <p class="row"><span data-t="storage"></span><span id="set-usage" class="muted"></span></p>
      </section>

      <section>
        <h3 data-t="security"></h3>
        <p class="note" data-t="securityNote"></p>
      </section>
    </form>
  </dialog>

  <div class="drop" id="drop" hidden><div class="drop-inner" data-t="drop"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
