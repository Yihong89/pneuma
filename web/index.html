<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>pneuma</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/icons/logo.svg" alt="" width="30" height="30">
        <span>pneuma</span>
      </div>

      <section class="panel chats-panel">
        <h2 class="panel-title"><span data-t="chats"></span></h2>
        <button type="button" class="panel-action" id="new-chat" data-t-title="newChat">+</button>
        <form class="new-chat" id="new-chat-form" hidden>
          <input id="new-chat-input" maxlength="80" autocomplete="off" spellcheck="false">
        </form>
        <ul class="chat-list" id="chat-list"></ul>
      </section>

    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="panel chat" id="chat">
      <header class="chat-head">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <h1 class="panel-title chat-title" id="chat-title" data-t-title="rename"></h1>
        <span class="status" id="status"></span>
        <div class="chat-tools">
          <button type="button" class="tool" id="rename-chat" data-t="rename"></button>
          <button type="button" class="tool danger" id="delete-chat" data-t="delete"></button>
        </div>
      </header>

      <div class="log" id="log" aria-live="polite">
        <div class="loader" id="loader" hidden></div>
        <div class="messages" id="messages"></div>
        <div class="empty" id="empty" hidden>
          <img src="/icons/logo.svg" alt="" width="120" height="120">
          <p id="empty-text"></p>
        </div>
        <div class="uploads" id="uploads"></div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="icon-btn" id="attach" data-t-title="attach">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <span class="prompt" aria-hidden="true">&gt;</span>
        <textarea id="input" rows="1" enterkeyhint="send"></textarea>
        <button type="submit" class="send" id="send" data-t-title="send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden>
      </form>
    </main>

    <aside class="panel devices-panel" id="devices">
      <h2 class="panel-title"><span data-t="devices"></span></h2>
      <ul class="device-list" id="device-list"></ul>
    </aside>
  </div>

  <div class="drop" id="drop" hidden><div class="drop-inner" data-t="drop"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
