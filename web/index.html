<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>pneuma</title>
  <meta name="theme-color" content="#17191e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="26" height="26">
      <span>pneuma</span>
    </div>
    <div class="me" id="me" hidden>
      <span class="status" id="status" title=""></span>
      <span id="me-name"></span>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite">
    <div class="loader" id="loader" hidden></div>
    <div class="messages" id="messages"></div>
    <div class="empty" id="empty" hidden>
      <img src="/icons/icon.svg" alt="" width="56" height="56">
      <p id="empty-text"></p>
    </div>
    <div class="uploads" id="uploads"></div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="icon-btn" id="attach" aria-label="Attach files">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M21 11.5 12.6 19.9a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <textarea id="input" rows="1" enterkeyhint="send"></textarea>
    <button type="submit" class="icon-btn send" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7-7-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <input type="file" id="file-input" multiple hidden>
  </form>

  <div class="drop" id="drop" hidden><div class="drop-inner" id="drop-text"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
